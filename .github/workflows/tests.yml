name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same runtime stack as the Pi, minus the Basler driver: the tests use image files
      - run: pip install opencv-contrib-python-headless numpy onnxruntime pyyaml pytest
      - run: pytest -q
